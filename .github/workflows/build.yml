name: Build GoKart

# Every push to main builds the plugin and publishes it on the repo's Releases page,
# so anyone can download GoKart-x.y.z.jar without building it themselves.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'

      - name: Build
        run: chmod +x gradlew && ./gradlew build --no-daemon

      - name: Read version
        id: version
        run: echo "version=$(grep -m1 '^version' build.gradle.kts | cut -d'"' -f2)" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@v4
        with:
          name: GoKart-jar
          path: build/libs/GoKart-*.jar

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.version.outputs.version }}
          name: GoKart ${{ steps.version.outputs.version }} by Redstoneskew
          body: |
            **GoKart ${{ steps.version.outputs.version }}** for Paper 26.3 (Java 25) — by Redstoneskew.

            Download `GoKart-${{ steps.version.outputs.version }}.jar` below and drop it in your server's `plugins/` folder.
          files: |
            build/libs/GoKart-*.jar
            build/pack/GoKart-pack.zip
          make_latest: true
